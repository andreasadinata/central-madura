<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central POS — Kasir</title>
<link rel="stylesheet" href="style.css">
<style>
  #app{height:100vh;flex-direction:column}
  .main{flex:1;display:grid;grid-template-columns:1fr 440px;overflow:hidden}
  @media(max-width:1000px){.main{grid-template-columns:1fr 380px}}

  /* LEFT */
  .left{display:flex;flex-direction:column;gap:12px;padding:20px;overflow:hidden}
  .search{position:relative;flex:1}
  .search input{padding-left:36px;height:44px;font-size:15px}
  .search svg{position:absolute;left:12px;top:14px;color:var(--faint)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chips button{padding:8px 14px}
  .chips button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:10px;overflow-y:auto;align-content:start;padding-bottom:20px}
  .card{text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-height:104px;background:var(--surface)}
  .card:hover{border-color:var(--accent)}
  .card .cat{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
  .card .nm{font-weight:500;line-height:1.35;flex:1}
  .card .ft{display:flex;justify-content:space-between;align-items:baseline}
  .card .pr{font-weight:700;font-size:15px}
  .card .st{font-size:11px;color:var(--muted)}
  .card .st.low{color:var(--red);font-weight:600}
  .empty{color:var(--muted);padding:24px;grid-column:1/-1}

  /* RIGHT */
  .right{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
  .pad{padding:16px 20px}
  .custbox{border:1px solid var(--border);border-radius:8px;padding:12px 14px}
  .custtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .custtop b{font-size:15px}
  .veh{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .veh button{padding:6px 10px;font-size:12px}
  .veh button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .results{position:absolute;left:0;right:0;top:44px;background:var(--surface);border:1px solid var(--border);border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:20;max-height:340px;overflow:auto}
  .results div{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border)}
  .results div:hover{background:var(--accent-soft)}
  .sec{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;
    text-transform:uppercase;padding:14px 20px 6px}
  .lines{flex:1;overflow-y:auto;padding:0 20px}
  .ln{display:grid;grid-template-columns:34px 1fr auto;gap:4px 8px;padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer}
  .ln .q{color:var(--muted);font-weight:500}
  .ln .t{font-weight:600;text-align:right}
  .ln .sub{grid-column:2/4;font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .ln.cancelled{opacity:.55;cursor:default}
  .ln.cancelled .n,.ln.cancelled .t{text-decoration:line-through}
  .ln.added .q{color:var(--accent);font-weight:700}
  .editor{grid-column:1/4;background:var(--page);border-radius:var(--r);padding:10px;margin-top:6px;display:grid;
    grid-template-columns:110px 1fr;gap:8px;cursor:default}
  .editor .full{grid-column:1/3}
  .stepper{display:flex}
  .stepper button{padding:6px 10px}
  .stepper input{text-align:center;border-radius:0;border-left:none;border-right:none}

  .foot{border-top:1px solid var(--border);padding:14px 20px 18px}
  .sum{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}
  .total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--border);padding-top:10px;margin:8px 0 12px}
  .total span{font-weight:600}
  .total b{font-size:28px;letter-spacing:-.02em}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .foot .seg2{margin-bottom:10px}
  .payrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .acts{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
  .acts button{height:48px;font-weight:600}
  .acts2{display:flex;gap:8px;margin-top:8px}
  .acts2 button{flex:1;font-size:12px;padding:7px}
  .notice{font-size:12px;padding:8px 10px;border-radius:var(--r);margin-bottom:10px}
  .notice.warn{background:var(--warn-bg);color:var(--warn-text);border:1px solid var(--warn-border)}
  .notice.red{background:var(--red-soft);color:var(--red)}

  /* PRINT */
  #print{display:none}
  @media print{
    body{background:#fff}
    #app,#login,.overlay,#toast{display:none!important}
    #print{display:block;color:#000}
  }
  @page inv{size:241mm 279mm;margin:8mm 10mm}
  @page small{size:80mm auto;margin:3mm}
  .p-inv{page:inv;font-family:"Courier New",monospace;font-size:11pt;line-height:1.3}
  .p-small{page:small;font-family:"Courier New",monospace;font-size:9pt;line-height:1.25;width:74mm}
  .p-inv table,.p-small table{width:100%;border-collapse:collapse}
  .p-inv td,.p-inv th,.p-small td{padding:1px 4px;border:none;background:none;font-size:inherit;color:#000;text-transform:none;letter-spacing:0;font-weight:normal}
  .p-inv th{border-bottom:1px dashed #000;border-top:1px dashed #000;text-align:left}
  .p-r,.p-inv th.p-r{text-align:right}
  .p-hr{border-top:1px dashed #000;margin:4px 0}
  .p-stamp{display:inline-block;border:2px solid #000;padding:2px 10px;font-weight:bold;font-size:13pt;margin-top:6px}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <h1>Central POS</h1>
    <p>Masuk untuk mulai</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="primary" id="loginBtn">Masuk</button>
    <div class="err" id="loginErr"></div>
    <button class="link forgot" id="forgotBtn">Lupa password?</button>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="logo" id="logo">CB</div>
    <div class="brand grow"><b id="locName">—</b><span>Kasir: <span id="whoName">—</span></span></div>
    <span class="chip" id="invChip">INVOICE BARU</span>
    <button onclick="openTx()">Transaksi <span class="small muted">· belum lunas</span> <b id="pendingCount" style="color:var(--red)"></b></button>
    <span id="branchSw"></span>
    <a id="adminLink" class="hide" href="admin.html"><button>Admin</button></a>
    <button onclick="logout()">Keluar</button>
  </div>

  <div class="main">
    <!-- LEFT: products -->
    <div class="left">
      <div class="row">
        <div class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" placeholder="Cari produk / jasa / kode / scan barcode…" autocomplete="off">
        </div>
      </div>
      <div class="row" style="gap:10px;align-items:flex-start">
        <div class="seg2" style="width:180px;flex-shrink:0"><button id="kB" onclick="setKind('barang')">Barang</button><button id="kJ" onclick="setKind('jasa')">Jasa</button></div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="grid" id="grid"><div class="empty">Memuat produk…</div></div>
    </div>

    <!-- RIGHT: invoice -->
    <div class="right">
      <div class="pad" style="padding-bottom:0">
        <div class="custbox">
          <div class="custtop">
            <div><b id="custName">—</b> <span class="small muted" id="custMeta"></span></div>
            <div class="row">
              <span class="chip" id="plateChip"></span>
              <button class="link small" id="custChangeBtn" onclick="startCustSearch()">Ganti</button>
            </div>
          </div>
          <div id="custSearchBox" style="position:relative;margin-top:10px">
            <div class="row">
              <input id="custQ" placeholder="Cari pelanggan: nama / plat / no HP…" autocomplete="off">
              <button onclick="openCustModal('new')">+ Baru</button>
            </div>
            <div class="results hide" id="custResults"></div>
          </div>
          <div class="veh" id="vehBox"></div>
        </div>
      </div>

      <div class="sec"><span id="secTitle">Keranjang</span><span id="itemCount">0 item</span></div>
      <div class="lines" id="lines"></div>

      <div class="foot" id="foot"></div>
    </div>
  </div>
</div>

<!-- TRANSACTIONS -->
<div class="overlay" id="txModal">
  <div class="modal" style="width:680px">
    <header><h3>Transaksi</h3><button onclick="closeModal('txModal')">Tutup</button></header>
    <div class="body">
      <div class="seg2" style="max-width:320px">
        <button id="txTabToday" class="on" onclick="loadTx('today')">Semua hari ini</button>
        <button id="txTabOpen" onclick="loadTx('open')">Belum lunas</button>
      </div>
      <table>
        <thead><tr><th>Invoice</th><th>Pelanggan</th><th>Plat</th><th>Status</th><th class="num">Total</th><th class="num">Sisa</th></tr></thead>
        <tbody id="txBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- NEW CUSTOMER / VEHICLE -->
<div class="overlay" id="custModal">
  <div class="modal">
    <header><h3 id="cmTitle">Pelanggan baru</h3><button onclick="closeModal('custModal')">Tutup</button></header>
    <div class="body">
      <div id="cmCustFields">
        <div class="field"><label>Nama *</label><input id="cmName"></div>
        <div class="grid2">
          <div class="field"><label>No HP *</label><input id="cmPhone" inputmode="tel"></div>
          <div class="field"><label>Alamat *</label><input id="cmAddr"></div>
        </div>
      </div>
      <div id="cmVehFields">
      <div class="field"><label>Mobil * <button class="link tiny hide" id="cmNewModel" onclick="newCarModel()">+ model baru</button></label><select id="cmModel" onchange="cmModelChanged()"></select></div>
      <div class="grid2" id="cmCarFields">
        <div class="field"><label>Plat nomor *</label><input id="cmPlate" style="text-transform:uppercase"></div>
        <div class="field"><label>Warna *</label><input id="cmColor" placeholder="mis. Hitam"></div>
      </div>
      </div>
      
      <div class="err" id="cmErr"></div>
    </div>
    <footer><button onclick="closeModal('custModal')">Batal</button><button class="primary" id="cmSave" onclick="saveCustModal()">Simpan</button></footer>
  </div>
</div>

<div id="print"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
// ═══════════════════════ STATE ═══════════════════════
let cats = [], products = [], byId = {}, tiers = {}, stock = {}, carModels = [];
let defaultList = null, priceListNames = {};
let catFilter = null, kind = "jasa";   // kind: "barang" | "jasa"; catFilter: category id (barang) or service group (jasa)
let cust = null, vehicles = [], vehicleId = null, freePlate = "";
const NO_CAR = -1;   // vehicleId = NO_CAR: "Tanpa mobil (beli barang)" — allowed only when the cart has no services
const cartHasService = () => cart.some(l => byId[l.pid]?.is_service);
let sale = null;            // loaded saved invoice (null = new invoice)
let cart = [];              // lines not yet saved: {pid, qty, price, reason, manual}
let editing = -1;           // index of cart line being edited
let method = "bayar", printFmt = "invoice";   // method: "bayar" (pay now) | "tempo"
let banks = [];
let busy = false;

const todayJkt = () => new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Jakarta" });
const fmtDT = d => new Date(d).toLocaleString("id-ID", { timeZone: "Asia/Jakarta", day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });

authGate(start);

async function start() {
  $("whoName").textContent = ME.full_name;
  $("locName").textContent = ME.locations?.name || "—";
  $("logo").textContent = (ME.locations?.code || "CB").slice(0, 2);
  if (ME.role !== "kasir") $("adminLink").classList.remove("hide");
  try {
    await loadMaster();
  } catch (e) { toast("Gagal memuat data: " + esc(errText(e)), "err"); return; }
  await setCustomer(null);
  setKind("jasa"); renderAll(); refreshPending();
  branchSwitcher($("branchSw"));
  const want = new URLSearchParams(location.search).get("sale");   // opened from Admin → Penjualan
  if (want) { history.replaceState(null, "", location.pathname); await openSale(Number(want)); }
  $("q").focus();
}

async function loadMaster() {
  const { data: locs } = await sb.from("locations").select("id,code");
  (locs || []).forEach(l => locCodes[l.id] = l.code);
  const [c, p, t, s, pl, cm, bk] = await Promise.all([
    sb.from("categories").select("*").order("sort"),
    fetchAll(() => sb.from("products").select("id,sku,barcode,name,brand,is_service,service_group,category_id,isi_per_dus").eq("is_active", true).order("name")),
    fetchAll(() => sb.from("price_tiers").select("product_id,price_list_id,min_qty,price").order("id")),
    fetchAll(() => sb.from("product_stock").select("product_id,location_id,qty").order("product_id")),
    sb.from("price_lists").select("*"),
    fetchAll(() => sb.from("car_models").select("*").order("brand")),
    sb.from("bank_accounts").select("*").eq("is_active", true).order("id")
  ]);
  if (c.error) throw c.error; if (pl.error) throw pl.error;
  cats = c.data; products = p; carModels = cm; banks = bk.data || [];
  byId = {}; products.forEach(x => byId[x.id] = x);
  tiers = {}; t.forEach(r => (tiers[r.product_id] ||= []).push(r));
  setStock(s);
  pl.data.forEach(l => { priceListNames[l.id] = l.name; if (l.is_default) defaultList = l.id; });
  fillModels();
}


// ═══════════════════════ PRODUCTS ═══════════════════════
// stock = this branch; stockElse[pid] = [[code, qty], ...] for other branches that have it
let stockElse = {}, locCodes = {};
function setStock(rows) {
  stock = {}; stockElse = {};
  rows.forEach(r => {
    if (r.location_id === ME.location_id) stock[r.product_id] = Number(r.qty);
    else if (Number(r.qty) > 0) (stockElse[r.product_id] ||= []).push([locCodes[r.location_id] || "?", Number(r.qty)]);
  });
}
const catName = id => (cats.find(c => c.id === id) || {}).name || "";
const stdPrice = (pid, qty) => tierFor(tiers, pid, cust?.price_list_id, defaultList, qty);

function setKind(k) { kind = k; catFilter = null; renderChips(); renderGrid(); }
function renderChips() {
  $("kB").classList.toggle("on", kind === "barang"); $("kJ").classList.toggle("on", kind === "jasa");
  const opts = kind === "barang"
    ? cats.filter(c => products.some(p => p.category_id === c.id)).map(c => [c.id, c.name])
    : [...new Set(products.filter(p => p.is_service && p.service_group).map(p => p.service_group))].sort().map(g => [g, g]);
  $("chips").innerHTML = [`<button class="${catFilter === null ? "on" : ""}" onclick="setCat(null)">Semua</button>`]
    .concat(opts.map(([v, l]) => `<button class="${catFilter === v ? "on" : ""}" onclick='setCat(${JSON.stringify(v)})'>${esc(l)}</button>`)).join("");
}
function setCat(v) { catFilter = v; renderChips(); renderGrid(); }
const inFilter = p => (p.is_service === (kind === "jasa")) &&
  (catFilter === null || (kind === "barang" ? p.category_id === catFilter : p.service_group === catFilter));

function matches(p, term) {
  if (!term) return true;
  const hay = (p.name + " " + p.sku + " " + (p.barcode || "") + " " + (p.brand || "") + " " + (p.service_group || "")).toLowerCase();
  return term.split(/\s+/).every(w => hay.includes(w));
}

function renderGrid() {
  const term = $("q").value.trim().toLowerCase();
  // typing searches everything (barang + jasa); the toggle and chips only filter when the search box is empty
  const list = products.filter(p => (term ? true : inFilter(p)) && matches(p, term)).slice(0, 90);
  if (!list.length) { $("grid").innerHTML = `<div class="empty">Tidak ada hasil untuk "${esc($("q").value)}".</div>`; return; }
  $("grid").innerHTML = list.map(p => {
    const t = stdPrice(p.id, 1), st = stock[p.id] || 0;
    return `<button class="card" onclick="addProduct(${p.id})">
      <span class="cat">${esc(p.is_service ? (p.service_group || "Jasa") : catName(p.category_id))}</span>
      <span class="nm">${esc(p.name)}</span>
      <span class="ft"><span class="pr">${t ? num(t.price) : "<span class='muted small'>belum ada harga</span>"}</span>
      <span class="st ${!p.is_service && st <= 0 ? "low" : ""}">${p.is_service ? "jasa" : "stok " + num(st)}</span></span>
      ${stockElse[p.id] ? `<span class="tiny muted">cabang lain: ${stockElse[p.id].map(([c, q]) => c + " " + num(q)).join(" · ")}</span>` : ""}
    </button>`;
  }).join("");
}

$("q").addEventListener("input", renderGrid);
$("q").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const raw = $("q").value.trim(); if (!raw) return;
  // barcode scanner types the code + Enter
  let hit = products.find(p => p.barcode && p.barcode === raw) || products.find(p => p.sku.toUpperCase() === raw.toUpperCase());
  if (!hit) {
    const term = raw.toLowerCase();
    const list = products.filter(p => matches(p, term));
    if (list.length === 1) hit = list[0];
  }
  if (hit) { addProduct(hit.id); $("q").value = ""; renderGrid(); }
  else toast(`Tidak ada produk dengan kode "${esc(raw)}".`, "err");
});

// ═══════════════════════ CART ═══════════════════════
function addProduct(pid) {
  if (sale && !canEdit()) { toast("Invoice ini tidak bisa diubah lagi (" + whyLocked() + ").", "err"); return; }
  const t = stdPrice(pid, 1);
  if (!t) { toast(`"${esc(byId[pid].name)}" belum punya harga. Minta admin mengisi harga.`, "err"); return; }
  const i = cart.findIndex(l => l.pid === pid && !l.manual);
  if (i > -1) { cart[i].qty++; reprice(i); }
  else { cart.push({ pid, qty: 1, price: t.price, reason: "", manual: false }); }
  renderAll();
}

function reprice(i) {
  const l = cart[i], t = stdPrice(l.pid, l.qty);
  if (t && !l.manual) l.price = t.price;
}

function setQty(i, v) {
  const q = Math.max(1, Number(String(v).replace(",", ".")) || 1);
  cart[i].qty = q; reprice(i); renderAll();
}
function setPrice(i, v) {
  const l = cart[i], std = stdPrice(l.pid, l.qty)?.price;
  l.price = parseRp(v); l.manual = l.price !== std;
  if (!l.manual) l.reason = "";
  renderAll();
}
function resetPrice(i) { cart[i].manual = false; cart[i].reason = ""; reprice(i); renderAll(); }
function setReason(i, v) { cart[i].reason = v; renderFoot(); const w = document.querySelectorAll("#lines .ln")[(sale ? sale.sale_items.length : 0) + i]?.querySelector(".warnbox"); if (w) w.textContent = w.textContent.replace(/ — .*$/, "") + " — " + (v.trim() || "alasan wajib"); }
function removeLine(i) { cart.splice(i, 1); editing = -1; renderAll(); }
function toggleEdit(i) { editing = editing === i ? -1 : i; renderLines(); }

const cartTotal = () => cart.reduce((s, l) => s + l.qty * l.price, 0);
const missingReason = () => cart.some(l => l.price < (stdPrice(l.pid, l.qty)?.price ?? 0) && !l.reason.trim());

// ═══════════════════════ CUSTOMER ═══════════════════════
// Every invoice needs a customer with HP + alamat and a vehicle with plat + warna.
// Walk-in who won't give details: staff type anything ("-", "xxx") — but they must type something.
const custMissing = c => c ? [!String(c.phone || "").trim() && "no HP", !String(c.address || "").trim() && "alamat"].filter(Boolean) : [];

async function setCustomer(c, pickVehicleId) {
  cust = c; vehicleId = null; vehicles = [];
  if (c) {
    const { data } = await sb.from("vehicles").select("*, car_models(brand,model)")
      .eq("customer_id", c.id).eq("is_active", true).order("created_at", { ascending: false });
    vehicles = data || [];
    if (pickVehicleId) vehicleId = pickVehicleId;
    else if (vehicles.length === 1) vehicleId = vehicles[0].id;
  }
  cart.forEach((l, i) => reprice(i));
  $("custSearchBox").classList.toggle("hide", !!c);
  renderCust(); renderGrid(); renderAll();
  if (!c && !sale) setTimeout(() => $("custQ").focus(), 50);
}

function vehLabel(v) {
  const m = v.car_models ? v.car_models.brand + " " + v.car_models.model : "";
  return [v.plate, m, v.color].filter(Boolean).join(" · ");
}

function renderCust() {
  if (!cust) {
    $("custName").textContent = "Pilih pelanggan";
    $("custMeta").innerHTML = '<span style="color:var(--red)">wajib sebelum simpan</span>';
    $("plateChip").classList.add("hide");
    $("custChangeBtn").classList.add("hide");
    $("vehBox").innerHTML = "";
    return;
  }
  $("custName").textContent = cust.name;
  const meta = [cust.phone, cust.price_list_id ? "Harga: " + priceListNames[cust.price_list_id] : null].filter(Boolean);
  const miss = custMissing(cust);
  $("custMeta").innerHTML = esc(meta.join(" · ")) + (cust.allow_tempo ? ' <span class="badge b-tempo">TEMPO</span>' : "")
    + (miss.length && !sale ? ` <button class="link small danger" onclick="openCustModal('edit')">Lengkapi ${miss.join(", ")}</button>` : "");
  const v = vehicles.find(x => x.id === vehicleId);
  const plateTxt0 = vehicleId === NO_CAR ? "Tanpa mobil" : null;
  const plateTxt = v ? v.plate : (sale ? sale.plate : "") || "";
  $("plateChip").textContent = plateTxt0 || plateTxt;

async function pickVehicle(id) {

$("custQ").addEventListener("keydown", e => { if (e.key === "Escape" && cust) $("custSearchBox").classList.add("hide"); });

async function searchCust() {
  const raw = $("custQ").value.trim();
  const box = $("custResults");
  if (raw.length < 2) { box.classList.add("hide"); return; }
  const q = raw.replace(/[,()%*]/g, " ").trim();
  const key = raw.toUpperCase().replace(/[^A-Z0-9]/g, "");
  const [cs, vs] = await Promise.all([
    sb.from("customers").select("*").eq("is_active", true).or(`name.ilike.%${q}%,phone.ilike.%${q}%`).order("name").limit(12),
    key.length >= 2
      ? sb.from("vehicles").select("id,plate,color,customer_id,customers!inner(*),car_models(brand,model)")
          .eq("is_active", true).eq("customers.is_active", true).ilike("plate_key", `%${key}%`).limit(12)
      : Promise.resolve({ data: [] })
  ]);
  if (cs.error || vs.error) { toast("Cari pelanggan gagal: " + esc(errText(cs.error || vs.error)), "err"); return; }
  const rows = [];
  (vs.data || []).forEach(v => rows.push({ c: v.customers, vid: v.id, label: `<b>${esc(v.customers.name)}</b> – ${esc(v.plate)} <span class="muted small">${esc(v.car_models ? v.car_models.brand + " " + v.car_models.model : "")} ${esc(v.color || "")}</span>` }));
  (cs.data || []).forEach(c => { if (!rows.some(r => r.c.id === c.id)) rows.push({ c, vid: null, label: `<b>${esc(c.name)}</b> <span class="muted small">${esc(c.phone || "")}</span>` }); });
  window._custRows = rows;
  box.innerHTML = rows.length ? rows.map((r, i) => `<div onclick="chooseCust(${i})">${r.label}</div>`).join("")
                              : `<div class="muted">Tidak ditemukan. Klik "+ Baru".</div>`;
  box.classList.remove("hide");
}
function chooseCust(i) { const r = window._custRows[i]; setCustomer(r.c, r.vid); }

// mode: "new" customer + vehicle · "vehicle" new vehicle for current customer · "edit" complete current customer
let cmMode = "new";

function cmModelChanged() { $("cmCarFields").classList.toggle("hide", $("cmModel").value === "none"); }
function fillModels(sel) {
  const brands = [...new Set(carModels.map(m => m.brand))].sort();
  $("cmModel").innerHTML = `<option value="">— pilih mobil —</option>` +
    (cmMode === "new" ? `<option value="none" ${sel === "none" ? "selected" : ""}>Pembelian barang (tanpa mobil)</option>` : "") + brands.map(b => `<optgroup label="${esc(b)}">` +
    carModels.filter(m => m.brand === b).sort((x, y) => x.model.localeCompare(y.model))
      .map(m => `<option value="${m.id}" ${m.id === sel ? "selected" : ""}>${esc(m.brand + " " + m.model)}</option>`).join("") + `</optgroup>`).join("");
}
// Only owner/admin can add a car model, so the list stays clean ("tyt avz" can't sneak in).
async function newCarModel() {
  // Cashiers add a model under an existing brand; only owner/admin can add a new brand. Duplicates are refused by the database.
  const brands = [...new Set(carModels.map(m => m.brand))].sort();
  let brand = prompt(`Merk? Pilih salah satu:\n${brands.join(", ")}` + (ME.role === "kasir" ? "" : "\n(atau ketik merk baru)"));
  if (!brand || !brand.trim()) return;
  const hit = brands.find(b => b.toLowerCase() === brand.trim().toLowerCase());
  if (!hit && ME.role === "kasir") { $("cmErr").textContent = `Merk "${brand}" belum ada. Merk baru hanya bisa ditambah owner/admin.`; return; }
  brand = hit || brand.trim().replace(/\s+/g, " ").replace(/\b\w/g, ch => ch.toUpperCase());
  const model = prompt(`Tipe ${brand} (tulis lengkap, mis. Avanza, Grand Max):`); if (!model || !model.trim()) return;
  const cap = t => t.trim().replace(/\s+/g, " ").replace(/\b\w/g, ch => ch.toUpperCase());
  const norm = t => t.toLowerCase().replace(/[^a-z0-9]/g, "");
  const dup = carModels.find(m => norm(m.brand + m.model) === norm(brand + model));
  if (dup) { fillModels(dup.id); $("cmErr").textContent = `${dup.brand} ${dup.model} sudah ada — sudah dipilih.`; return; }
  const { data, error } = await sb.from("car_models").insert({ brand, model: cap(model) }).select().single();
  if (error) { $("cmErr").textContent = "Gagal tambah model: " + error.message; return; }
  carModels.push(data); fillModels(data.id);
}

async function saveCustModal() {
  const err = $("cmErr"); err.textContent = "";
  const name = $("cmName").value.trim(), phone = $("cmPhone").value.trim(), addr = $("cmAddr").value.trim();
  const plate = $("cmPlate").value.trim().toUpperCase().replace(/\s+/g, " "), color = $("cmColor").value.trim();
  const need = [];
  if (cmMode !== "vehicle") { if (!name) need.push("nama"); if (!phone) need.push("no HP"); if (!addr) need.push("alamat"); }
  const noCar = $("cmModel").value === "none";
  if (cmMode !== "edit") { if (!$("cmModel").value) need.push("mobil (atau \"Pembelian barang\")"); else if (!noCar) { if (!plate) need.push("plat"); if (!color) need.push("warna"); } }
  if (need.length) { err.textContent = "Wajib diisi: " + need.join(", ") + ". Pelanggan yang tidak mau memberi data: isi \"-\"."; return; }
  try {
    $("cmSave").disabled = true;
    let c = cust;
    if (cmMode === "new") {
      const digits = phone.replace(/\D/g, "");
      if (digits.length >= 6) {
        const { data: dup } = await sb.from("customers").select("id,name").eq("phone", phone).limit(1);
        if (dup && dup.length && !confirm(`No HP ${phone} sudah terdaftar atas nama "${dup[0].name}". Tetap buat pelanggan baru?`)) return;
      }
      const ins = await sb.from("customers").insert({ name: name.toUpperCase(), phone, address: addr, created_by: ME.id }).select().single();
      if (ins.error) throw ins.error;
      c = ins.data;
    } else if (cmMode === "edit") {
      const up = await sb.from("customers").update({ name: name.toUpperCase(), phone, address: addr }).eq("id", cust.id).select().single();
      if (up.error) throw up.error;
      c = up.data;
    }
    let vid = vehicleId === NO_CAR ? null : vehicleId;
    if (noCar && cmMode === "new") vid = NO_CAR;
    else if (cmMode !== "edit") {
      const modelId = Number($("cmModel").value);
      const v = await sb.from("vehicles").insert({ customer_id: c.id, plate, car_model_id: modelId, color }).select().single();
      if (v.error) throw v.error;
      vid = v.data.id;
    }
    closeModal("custModal");
    await setCustomer(c, vid);
  } catch (e) { err.textContent = "Gagal simpan: " + errText(e); }
  finally { $("cmSave").disabled = false; }
}

function renderAll() { renderLines(); renderFoot(); renderHeader(); }

function renderHeader() {

function renderLines() {
  let h = "";
  if (sale) {
    h += sale.sale_items.map(it => {
      const c = !!it.cancelled_at;
      const sub = [];
      if (it.qty > 1) sub.push("@ " + num(it.unit_price));
      if (it.unit_price < it.standard_price) sub.push(`<span class="warnbox">Turun dari ${num(it.standard_price)} — ${esc(it.price_reason || "")}</span>`);
      if (it.added_after_print) sub.push(`<span class="badge b-tempo">ditambah setelah cetak</span>`);
      if (c) sub.push(`<span style="color:var(--red)">Dibatalkan: ${esc(it.cancel_reason)}</span>`);
      else if (canEdit()) sub.push(`<button class="link small danger" onclick="cancelItem(${it.id})">Batalkan</button>`);
      return `<div class="ln ${c ? "cancelled" : ""}"><span class="q">${num(it.qty)}×</span><span class="n">${esc(it.products.name)}</span>
        <span class="t">${num(it.line_total)}</span><div class="sub">${sub.join("")}</div></div>`;
    }).join("");
    if (cart.length) h += `<div class="sec" style="padding:14px 0 4px">Tambahan (belum disimpan)</div>`;
  }
  h += cart.map((l, i) => {
    const p = byId[l.pid], t = stdPrice(l.pid, l.qty), std = t ? t.price : 0;
    const sub = [];
    if (l.qty > 1) sub.push("@ " + num(l.price));
    if (l.price < std) sub.push(`<span class="warnbox">Turun dari ${num(std)}${l.reason ? " — " + esc(l.reason) : " — alasan wajib"}</span>`);
    else if (l.price > std) sub.push(`<span class="warnbox">Naik dari ${num(std)}</span>`);
    const nt = nextTier(tiers, l.pid, cust?.price_list_id, defaultList, l.qty);
    if (nt && !l.manual) sub.push(`<span>beli ${num(nt.min_qty)} → @ ${num(nt.price)}</span>`);
    if (!p.is_service && (stock[l.pid] || 0) < l.qty) sub.push(`<span style="color:var(--red)">stok ${num(stock[l.pid] || 0)}</span>`);
    let ed = "";
    if (editing === i) ed = `<div class="editor" onclick="event.stopPropagation()">
        <div><label>Qty</label><div class="stepper"><button onclick="setQty(${i},${l.qty - 1})">−</button>
          <input value="${l.qty}" onchange="setQty(${i},this.value)"><button onclick="setQty(${i},${l.qty + 1})">+</button></div></div>
        <div><label>Harga satuan ${l.manual ? `· <button class="link tiny" onclick="resetPrice(${i})">kembali ke ${num(std)}</button>` : ""}</label>
          <input value="${num(l.price)}" onchange="setPrice(${i},this.value)" inputmode="numeric"></div>
        ${l.price < std ? `<div class="full"><label>Alasan turun harga (wajib)</label><input value="${esc(l.reason)}" oninput="setReason(${i},this.value)" placeholder="mis. langganan lama"></div>` : ""}
        <div class="full row" style="justify-content:space-between"><button class="link danger small" onclick="removeLine(${i})">Hapus dari keranjang</button><button class="small" onclick="toggleEdit(${i})">Selesai</button></div>
      </div>`;
    return `<div class="ln ${sale ? "added" : ""}" onclick="toggleEdit(${i})"><span class="q">${num(l.qty)}×</span><span class="n">${esc(p.name)}</span>
      <span class="t">${num(l.qty * l.price)}</span><div class="sub">${sub.join("")}</div>${ed}</div>`;
  }).join("");
  if (!h) h = `<div class="empty">Belum ada item. Klik produk di kiri atau scan barcode.</div>`;
  $("lines").innerHTML = h;
  renderHeader();
}

function renderFoot() {
  let h = "";
  const tempoOK = cust?.allow_tempo;
  if (!tempoOK && method === "tempo") method = "bayar";
  const segPrint = `<div class="seg2"><button class="${printFmt === "invoice" ? "on" : ""}" onclick="printFmt='invoice';renderFoot()">Invoice besar</button><button class="${printFmt === "small" ? "on" : ""}" onclick="printFmt='small';renderFoot()">Nota kecil</button></div>`;

  if (!sale) {
    const tot = cartTotal();
    h += `<div class="total"><span>Total</span><b>${rp(tot)}</b></div>`;
    if (tempoOK) h += `<div class="seg2"><button class="${method === "bayar" ? "on" : ""}" onclick="method='bayar';renderFoot()">Bayar sekarang</button><button class="${method === "tempo" ? "on" : ""}" onclick="method='tempo';renderFoot()">Tempo</button></div>`;
    if (method !== "tempo" && tot > 0) h += payBlock(tot);
    h += segPrint;
    const why = !cust ? "Pilih pelanggan dulu." : !vehicleId ? "Pilih kendaraan, atau \"Tanpa mobil\" kalau hanya beli barang."
      : vehicleId === NO_CAR && cartHasService() ? "Ada jasa di keranjang: pilih kendaraan (bukan \"Tanpa mobil\")." : custMissing(cust).length ? "Lengkapi data pelanggan: " + custMissing(cust).join(", ") + "." : "";
    const bad = !cart.length || missingReason() || !!why;
    h += `<div class="acts"><button ${bad ? "disabled" : ""} onclick="saveNew(false)" title="Simpan tanpa bayar — muncul di Transaksi tertunda">Simpan</button>
      <button class="go" ${bad ? "disabled" : ""} onclick="saveNew(true)">${method === "tempo" ? "Simpan tempo & cetak" : "Bayar & cetak"}</button></div>`;
    if (why && cart.length) h += `<div class="notice warn" style="margin:10px 0 0">${esc(why)}</div>`;
    if (missingReason()) h += `<div class="notice warn" style="margin:10px 0 0">Ada harga di bawah normal tanpa alasan. Klik barisnya untuk mengisi alasan.</div>`;
  } else {
    const tot = Number(sale.total), paid = Number(sale.paid_amount), add = cartTotal();
    const sisa = sale.status === "void" ? 0 : tot - paid;
    const over = sale.status === "void" ? paid : paid - tot;
    let badge = sale.status === "void" ? '<span class="badge b-void">VOID</span>' : sale.status === "paid" ? '<span class="badge b-paid">LUNAS</span>' : '<span class="badge b-open">BELUM LUNAS</span>';
    if (sale.is_tempo) badge += ' <span class="badge b-tempo">TEMPO</span>';
    if (sale.status === "void") h += `<div class="notice red">VOID — ${esc(sale.void_reason)}. Tidak bisa diubah.</div>`;
    else if (!canEdit()) h += `<div class="notice warn">Invoice tanggal ${sale.business_date}: isi tidak bisa diubah lagi. Untuk barang/jasa yang lupa, buat invoice baru (nota susulan). Pembayaran tetap bisa.</div>`;
    h += `<div class="sum"><span>${badge} · ${invDate(sale)} · ${esc(sale.cashier?.full_name || "")}</span></div>`;
    if (sale.business_date !== todayJkt() && ME.role === "owner" && sale.status !== "void") h += `<div class="notice warn">Invoice tanggal ${sale.business_date}. Anda owner: perubahan tetap bisa, dan tercatat.</div>`;
    sale.payments.forEach(p => h += `<div class="sum"><span>${payLabel(p)} · ${fmtDT(p.created_at)}</span><span>${num(p.amount)}</span></div>`);
    h += `<div class="total"><span>Total</span><b>${rp(tot)}</b></div>`;
    if (sale.status !== "void" && paid) h += `<div class="sum"><span>Sisa</span><span style="font-weight:700;color:${sisa > 0 ? "var(--red)" : "inherit"}">${num(Math.max(sisa, 0))}</span></div>`;

    if (cart.length) {
      h += `<div class="notice warn">Tambahan ${rp(add)} belum disimpan.</div>`;
      h += `<div class="acts"><button onclick="cart=[];editing=-1;renderAll()">Buang tambahan</button><button class="primary" ${missingReason() ? "disabled" : ""} onclick="saveAdditions()">Simpan tambahan</button></div>`;
    } else {
      if (over > 0) {
        h += `<div class="notice red">Lebih bayar ${rp(over)} — harus dikembalikan ke pelanggan.</div>`;
        h += `<div class="payrow"><div><label>Dikembalikan lewat</label><select id="refundM">${payOptions("tunai")}</select></div>
              <div style="align-self:end"><button class="primary" style="width:100%" onclick="refund(${over})">Kembalikan ${rp(over)}</button></div></div>`;
      } else if (sisa > 0) {
        h += payBlock(sisa);
      }
      h += segPrint;
      h += `<div class="acts"><button onclick="newInvoice()">Invoice baru</button>`;
      h += sisa > 0 && over <= 0 ? `<button class="go" onclick="payExisting()">Bayar & cetak</button>` : `<button class="primary" onclick="reprint()">Cetak ulang</button>`;
      h += `</div><div class="acts2">`;
      if (sisa > 0 && over <= 0) h += `<button onclick="reprint()">Cetak ${sale.is_tempo ? "(belum lunas)" : ""}</button>`;
      if (ME.role === "owner" && sale.status !== "void") h += `<button onclick="changeDate()">Ubah tanggal</button>`;
      if (canEdit()) h += `<button class="danger" onclick="voidSale()">Void invoice</button>`;
      h += `</div>`;
    }
  }
  $("foot").innerHTML = h;
  payRecalc();
}

// ── Payment lines: several ways to pay one invoice (e.g. transfer 2.000.000 + tunai 475.000).
//    Received more than due → the difference is given back in cash and recorded as "kembalian".
let payLines = [], payDue = null;
const payOptions = sel => `<option value="tunai" ${sel === "tunai" ? "selected" : ""}>Tunai</option>` +
  banks.map(b => `<option value="tf:${b.id}" ${sel === "tf:" + b.id ? "selected" : ""}>Transfer ${esc(b.name)}</option>`).join("");
function payLabel(p) {
  if (p.is_change) return "Kembalian tunai";
  const how = p.method === "transfer" ? "Transfer " + (p.bank_accounts?.name || "") : "Tunai";
  return (p.amount < 0 ? "Dikembalikan · " : "Dibayar · ") + how;
}
function payBlock(due) {
  if (payDue !== due || !payLines.length) { payLines = [{ m: "tunai", amt: due }]; payDue = due; }
  return `<div style="margin-bottom:10px"><label>Pembayaran (kurangi untuk DP)</label>` +
    payLines.map((l, i) => `<div class="row" style="margin-bottom:6px">
      <select style="flex:1.2" onchange="payLines[${i}].m=this.value">${payOptions(l.m)}</select>
      <input style="flex:1" class="num" inputmode="numeric" value="${num(l.amt)}" oninput="this.value=num(parseRp(this.value));payLines[${i}].amt=parseRp(this.value);payRecalc()">
      ${payLines.length > 1 ? `<button class="link danger" onclick="payLines.splice(${i},1);renderFoot()">×</button>` : ""}</div>`).join("") +
    `<div class="row" style="justify-content:space-between"><button class="link small" onclick="addPayLine()">+ cara bayar lain</button><span class="small" id="paySum"></span></div></div>`;
}
function addPayLine() {
  const recv = payLines.reduce((a, l) => a + l.amt, 0);
  payLines.push({ m: banks[0] ? "tf:" + banks[0].id : "tunai", amt: Math.max(payDue - recv, 0) });
  renderFoot();
}
function payRecalc() {
  const el = $("paySum"); if (!el) return;
  const recv = payLines.reduce((a, l) => a + l.amt, 0), diff = recv - payDue;
  el.innerHTML = diff >= 0
    ? `Diterima ${num(recv)}${diff > 0 ? ` · <b>kembalian tunai ${num(diff)}</b>` : ""}`
    : `Diterima ${num(recv)} · <b style="color:var(--red)">sisa ${num(-diff)}</b> (DP)`;
}
const payPayload = () => payLines.filter(l => l.amt > 0).map(l => l.m === "tunai"
  ? { method: "tunai", amount: l.amt } : { method: "transfer", bank_account_id: Number(l.m.slice(3)), amount: l.amt });

// ═══════════════════════ ACTIONS ═══════════════════════
const itemsPayload = () => cart.map(l => ({ product_id: l.pid, qty: l.qty, unit_price: l.price, reason: l.reason.trim() }));

async function guard(fn) {
  if (busy) return; busy = true;
  document.querySelectorAll("#foot button").forEach(b => b.disabled = true);
  try { await fn(); }
  catch (e) { toast(esc(errText(e)), "err"); renderFoot(); }
  finally { busy = false; }
}

function saveNew(payAndPrint) {
  if (!cust || !vehicleId) { toast("Pilih pelanggan dan kendaraan (atau \"Tanpa mobil\") dulu.", "err"); return; }
  guard(async () => {
    const pay = method === "tempo" ? [] : payPayload();
    const { data: s, error } = await sb.rpc("create_sale", {
      p_customer: cust.id, p_vehicle: vehicleId === NO_CAR ? null : vehicleId, p_plate: null,
      p_items: itemsPayload(), p_tempo: method === "tempo"
    });
    if (error) throw error;
    let msg = `Tersimpan · <b>${s.invoice_no}</b> · ${rp(s.total)}`;
    if (payAndPrint && pay.length) {
      const p = await sb.rpc("pay_sale_multi", { p_sale: s.id, p_lines: pay });
      if (p.error) { toast(`Invoice ${s.invoice_no} tersimpan, tapi pembayaran GAGAL: ${esc(p.error.message)}. Buka di Transaksi tertunda.`, "err"); afterSave(); return; }
      const recv = pay.reduce((a, l) => a + l.amount, 0);
      if (recv < s.total) msg += ` · DP ${rp(recv)}`;
      if (recv > s.total) msg += ` · kembalian ${rp(recv - s.total)}`;
    }
    if (payAndPrint) await doPrint(s.id);
    toast(msg);
    afterSave();
  });
}

function afterSave() {
  refreshStock(); refreshPending(); newInvoice();
}

function saveAdditions() {
  guard(async () => {
    const { error } = await sb.rpc("add_sale_items", { p_sale: sale.id, p_items: itemsPayload() });
    if (error) throw error;
    cart = []; editing = -1;
    sale = await loadSale(sale.id);
    toast(`Tambahan tersimpan · ${sale.invoice_no}${sale.revision > 1 ? " Rev " + sale.revision : ""}`);
    refreshStock(); refreshPending(); renderAll();
  });
}

function cancelItem(itemId) {
  const it = sale.sale_items.find(x => x.id === itemId);
  const reason = prompt(`Batalkan "${it.products.name}" ×${num(it.qty)} (${rp(it.line_total)})?\nAlasan (wajib):`);
  if (reason === null) return;
  if (!reason.trim()) { toast("Alasan wajib diisi. Item tidak dibatalkan.", "err"); return; }
  guard(async () => {
    const { error } = await sb.rpc("cancel_sale_item", { p_item: itemId, p_reason: reason });
    if (error) throw error;
    sale = await loadSale(sale.id);
    toast(`Item dibatalkan · tercatat untuk owner`);
    refreshStock(); refreshPending(); renderAll();
  });
}

function payExisting() {
  guard(async () => {
    const pay = payPayload();
    if (!pay.length) throw new Error("Isi jumlah pembayaran.");
    const { error } = await sb.rpc("pay_sale_multi", { p_sale: sale.id, p_lines: pay });
    if (error) throw error;
    await doPrint(sale.id);
    toast(`Pembayaran ${rp(pay.reduce((a, l) => a + l.amount, 0))} tercatat · ${sale.invoice_no}`);
    refreshPending(); payLines = []; payDue = null;
    sale = await loadSale(sale.id); renderAll();
  });
}

function refund(max) {
  const m = $("refundM").value, how = m === "tunai" ? "tunai" : "transfer " + banks.find(b => "tf:" + b.id === m)?.name;
  const reason = prompt(`Kembalikan ${rp(max)} (${how}) ke pelanggan.\nAlasan (wajib):`);
  if (reason === null) return;
  if (!reason.trim()) { toast("Alasan wajib diisi. Tidak ada uang dikembalikan.", "err"); return; }
  guard(async () => {
    const { error } = await sb.rpc("refund_sale", { p_sale: sale.id, p_method: m === "tunai" ? "tunai" : "transfer",
      p_amount: max, p_reason: reason, p_bank: m === "tunai" ? null : Number(m.slice(3)) });
    if (error) throw error;
    sale = await loadSale(sale.id);
    toast(`Pengembalian ${rp(max)} tercatat`);
    renderAll();
  });
}

function voidSale() {
  const reason = prompt(`VOID seluruh invoice ${sale.invoice_no} (${rp(sale.total)})?\nNomor tetap tercatat. Alasan (wajib):`);
  if (reason === null) return;
  if (!reason.trim()) { toast("Alasan wajib diisi. Invoice tidak di-void.", "err"); return; }
  guard(async () => {
    const { error } = await sb.rpc("void_sale", { p_sale: sale.id, p_reason: reason });
    if (error) throw error;
    sale = await loadSale(sale.id);
    toast(`${sale.invoice_no} di-void`);
    refreshStock(); refreshPending(); renderAll();
  });
}

// Date printed on the invoice = business_date (owner may change it); time only if it is still the day it was made.
function invDate(s) {
  const made = new Date(s.opened_at).toLocaleDateString("en-CA", { timeZone: "Asia/Jakarta" });
  if (made === s.business_date) return fmtDT(s.opened_at);
  const [y, m, d] = s.business_date.split("-"); return `${d}/${m}/${y}`;
}

function changeDate() {
  const d = prompt(`Tanggal baru untuk ${sale.invoice_no} (sekarang ${sale.business_date}).\nFormat: TTTT-BB-HH, mis. 2026-11-22`, sale.business_date);
  if (!d) return;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.trim())) { toast("Format tanggal harus TTTT-BB-HH, mis. 2026-11-22.", "err"); return; }
  const reason = prompt("Alasan ubah tanggal (wajib), mis. \"PT minta tanggal 22\":");
  if (!reason || !reason.trim()) { toast("Alasan wajib diisi. Tanggal tidak diubah.", "err"); return; }
  guard(async () => {
    const { error } = await sb.rpc("change_sale_date", { p_sale: sale.id, p_date: d.trim(), p_reason: reason });
    if (error) throw error;
    sale = await loadSale(sale.id); toast(`Tanggal ${sale.invoice_no} → ${sale.business_date}`); renderAll();
  });
}

function reprint() { guard(async () => { await doPrint(sale.id); sale = await loadSale(sale.id); renderAll(); }); }

async function refreshStock() {
  const s = await fetchAll(() => sb.from("product_stock").select("product_id,location_id,qty").order("product_id")).catch(() => null);
  if (s) { setStock(s); renderGrid(); }
}

// ═══════════════════════ TRANSACTIONS LIST ═══════════════════════
async function refreshPending() {
  const { count } = await sb.from("sales").select("id", { count: "exact", head: true })
    .eq("location_id", ME.location_id).eq("status", "open");
  $("pendingCount").textContent = count || "";
}

function openTx() { $("txModal").classList.add("open"); loadTx("today"); }

async function loadTx(which) {
  $("txTabOpen").classList.toggle("on", which === "open");
  $("txTabToday").classList.toggle("on", which === "today");
  let q = sb.from("sales").select("id,invoice_no,status,is_tempo,total,paid_amount,plate,business_date,customers(name)")
    .eq("location_id", ME.location_id).order("id", { ascending: false }).limit(200);
  q = which === "open" ? q.eq("status", "open") : q.eq("business_date", todayJkt());
  const { data, error } = await q;
  if (error) { $("txBody").innerHTML = `<tr><td colspan="6" class="err">${esc(error.message)}</td></tr>`; return; }
  $("txBody").innerHTML = data.length ? data.map(s => {
    const b = s.status === "void" ? "b-void" : s.status === "paid" ? "b-paid" : "b-open";
    const lbl = s.status === "void" ? "VOID" : s.status === "paid" ? "LUNAS" : "BELUM";
    return `<tr class="click" onclick="openSale(${s.id})"><td><b>${s.invoice_no}</b><div class="tiny muted">${s.business_date}</div></td>
      <td>${esc(s.customers?.name)}</td><td>${esc(s.plate || "")}</td>
      <td><span class="badge ${b}">${lbl}</span>${s.is_tempo ? ' <span class="badge b-tempo">TEMPO</span>' : ""}</td>
      <td class="num">${num(s.total)}</td><td class="num">${s.status === "open" ? num(s.total - s.paid_amount) : ""}</td></tr>`;
  }).join("") : `<tr><td colspan="6" class="muted">Tidak ada.</td></tr>`;
}

function closeModal(id) { $(id).classList.remove("open"); }

// ═══════════════════════ PRINT ═══════════════════════
async function doPrint(id) {
  const s = await loadSale(id);
  $("print").innerHTML = printFmt === "small" ? printSmall(s) : printInvoice(s);
  await sb.rpc("mark_printed", { p_sale: id });
  window.print();
}

function stampText(s) {
  if (s.status === "void") return "VOID";
  if (s.status === "paid") return "LUNAS";
  return s.is_tempo ? "BELUM LUNAS - TEMPO" : "BELUM LUNAS";
}

function printInvoice(s) {
  const L = ME.locations, items = s.sale_items.filter(i => !i.cancelled_at);
  const veh = s.vehicles ? vehLabel(s.vehicles) : (s.plate || "— (pembelian barang)");
  const sisa = Number(s.total) - Number(s.paid_amount);
  return `<div class="p-inv">
    <table><tr><td style="width:60%"><b style="font-size:14pt">${esc(L.name.toUpperCase())}</b><br>${esc(L.address || "")}<br>${esc(L.phone || "")}</td>
      <td class="p-r"><b style="font-size:13pt">INVOICE</b><br>${s.invoice_no}${s.revision > 1 ? " (Rev " + s.revision + ")" : ""}<br>${invDate(s)}<br>Kasir: ${esc(s.cashier?.full_name || "")}</td></tr></table>
    <div class="p-hr"></div>
    <table><tr><td>Pelanggan : ${esc(s.customers.name)}${s.customers.phone ? " / " + esc(s.customers.phone) : ""}</td></tr>
      ${s.customers.address ? `<tr><td>Alamat    : ${esc(s.customers.address)}</td></tr>` : ""}
      <tr><td>Kendaraan : ${esc(veh)}</td></tr></table>
    <br>
    <table><tr><th style="width:5%">No</th><th>Barang / Jasa</th><th class="p-r" style="width:8%">Qty</th><th class="p-r" style="width:15%">Harga</th><th class="p-r" style="width:17%">Jumlah</th></tr>
      ${items.map((it, i) => `<tr><td>${i + 1}</td><td>${esc(it.products.name)}</td><td class="p-r">${num(it.qty)}</td><td class="p-r">${num(it.unit_price)}</td><td class="p-r">${num(it.line_total)}</td></tr>`).join("")}
    </table>
    <div class="p-hr"></div>
    <table><tr><td style="width:55%">${s.status === "void" ? "" : ""}<span class="p-stamp">${stampText(s)}</span></td><td>
      <table><tr><td>TOTAL</td><td class="p-r"><b>${num(s.total)}</b></td></tr>
      ${s.payments.map(p => `<tr><td>${payLabel(p).replace("Dibayar · ", "")} ${new Date(p.created_at).toLocaleDateString("id-ID",{timeZone:"Asia/Jakarta"})}</td><td class="p-r">${num(p.amount)}</td></tr>`).join("")}
      ${s.status !== "void" && s.payments.length ? `<tr><td><b>SISA</b></td><td class="p-r"><b>${num(Math.max(sisa, 0))}</b></td></tr>` : ""}
      </table></td></tr></table>
    <br><br>
    <table><tr><td style="text-align:center;width:50%">Hormat kami,<br><br><br>( ${esc(s.cashier?.full_name || "")} )</td><td style="text-align:center">Penerima,<br><br><br>(.................)</td></tr></table>
  </div>`;
}

function printSmall(s) {
  const L = ME.locations, items = s.sale_items.filter(i => !i.cancelled_at);
  const sisa = Number(s.total) - Number(s.paid_amount);
  return `<div class="p-small">
    <div style="text-align:center"><b>${esc(L.name.toUpperCase())}</b><br>${esc(L.address || "")} ${esc(L.phone || "")}</div>
    <div class="p-hr"></div>
    ${s.invoice_no}${s.revision > 1 ? " Rev " + s.revision : ""}<br>${invDate(s)} · ${esc(s.cashier?.full_name || "")}<br>
    ${esc(s.customers.name)}${s.plate ? " · " + esc(s.plate) : ""}
    <div class="p-hr"></div>
    <table>${items.map(it => `<tr><td colspan="2">${esc(it.products.name)}</td></tr><tr><td>&nbsp; ${num(it.qty)} x ${num(it.unit_price)}</td><td class="p-r">${num(it.line_total)}</td></tr>`).join("")}</table>
    <div class="p-hr"></div>
    <table><tr><td><b>TOTAL</b></td><td class="p-r"><b>${num(s.total)}</b></td></tr>
    ${s.payments.map(p => `<tr><td>${payLabel(p).replace("Dibayar · ", "")}</td><td class="p-r">${num(p.amount)}</td></tr>`).join("")}
    ${s.status !== "void" && s.payments.length ? `<tr><td>SISA</td><td class="p-r">${num(Math.max(sisa, 0))}</td></tr>` : ""}</table>
    <div style="text-align:center;margin-top:6px"><b>${stampText(s)}</b><br>Terima kasih</div>
  </div>`;
}
</script>
</body>
</html>
