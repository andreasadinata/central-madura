<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central POS — Kasir</title>
<style>
  :root{
    --bg:#0d1117; --surface:#161b22; --raised:#1c2333; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --dim:#4b5563;
    --amber:#f59e0b; --green:#10b981; --blue:#3b82f6; --red:#ef4444; --purple:#a78bfa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--text);height:100vh;overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer;border:none;border-radius:7px;font-weight:600}
  button:active{transform:scale(.97)}
  input,select{
    font-family:inherit;background:var(--bg);border:1px solid var(--border);
    color:var(--text);padding:10px 12px;border-radius:7px;font-size:14px;outline:none;
  }
  input:focus,select:focus{border-color:var(--amber)}

  /* ---------- LOGIN ---------- */
  #login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
  #login.hide{display:none}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:36px;width:340px}
  .login-card h1{font-size:20px;letter-spacing:3px;color:var(--amber);text-transform:uppercase;margin-bottom:6px;font-weight:700}
  .login-card p{font-size:12px;color:var(--muted);margin-bottom:24px;letter-spacing:1px}
  .login-card input{width:100%;margin-bottom:10px}
  .login-card button{width:100%;background:var(--amber);color:#111;padding:12px;font-size:14px;margin-top:6px}
  .err{color:var(--red);font-size:12px;min-height:16px;margin-top:8px}

  /* ---------- SHELL ---------- */
  #app{display:none;height:100vh;flex-direction:column}
  #app.show{display:flex}
  .topbar{
    background:var(--surface);border-bottom:2px solid var(--amber);padding:10px 20px;
    display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:16px;
  }
  .brand{font-size:17px;font-weight:700;letter-spacing:2px;color:var(--amber);text-transform:uppercase}
  .who{font-size:12px;color:var(--muted)}
  .who b{color:var(--text)}
  .logout{background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 12px;font-size:12px}

  .main{display:grid;grid-template-columns:1fr 380px;flex:1;overflow:hidden}
  @media(max-width:900px){.main{grid-template-columns:1fr}}

  /* ---------- LEFT: SEARCH + GRID ---------- */
  .left{display:flex;flex-direction:column;overflow:hidden;padding:16px;gap:12px}
  .searchrow{display:flex;gap:8px}
  .searchrow input{flex:1;font-size:16px;padding:13px 14px}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:10px;overflow-y:auto;align-content:start;padding-bottom:20px;
  }
  .pcard{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:12px;text-align:left;color:var(--text);transition:border-color .12s;
  }
  .pcard:hover{border-color:var(--amber)}
  .pname{font-size:13px;font-weight:600;line-height:1.35;margin-bottom:6px}
  .psku{font-size:10px;color:var(--dim);letter-spacing:1px}
  .pprice{font-size:15px;color:var(--green);font-weight:700;margin-top:4px}
  .ptag{
    display:inline-block;font-size:9px;padding:2px 6px;border-radius:10px;
    letter-spacing:1px;margin-top:6px;text-transform:uppercase;font-weight:700;
  }
  .tag-svc{background:#1e3a5f;color:#93c5fd}
  .tag-grp{background:#2e2258;color:var(--purple)}
  .empty{color:var(--dim);font-size:13px;padding:20px;grid-column:1/-1}

  /* ---------- RIGHT: CART ---------- */
  .right{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
  .cart-head{padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
  .cart-head label{display:block;font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
  .cart-head select{width:100%}
  .contract-note{
    font-size:11px;color:var(--purple);margin-top:8px;min-height:14px;letter-spacing:.5px;
  }
  .lines{flex:1;overflow-y:auto;padding:8px 12px}
  .line{
    background:var(--bg);border:1px solid var(--border);border-radius:9px;
    padding:10px 12px;margin-bottom:8px;
  }
  .line-top{display:flex;justify-content:space-between;align-items:start;gap:8px}
  .line-name{font-size:13px;font-weight:600;line-height:1.3}
  .del{background:transparent;color:var(--dim);font-size:16px;padding:0 4px;line-height:1}
  .del:hover{color:var(--red)}
  .line-mid{display:flex;align-items:center;gap:8px;margin-top:8px}
  .qty{width:56px;padding:6px 8px;font-size:14px;text-align:center}
  .times{color:var(--dim);font-size:12px}
  .price-in{width:110px;padding:6px 8px;font-size:14px;text-align:right}
  .line-bot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .src{font-size:9px;padding:2px 7px;border-radius:10px;letter-spacing:1px;text-transform:uppercase;font-weight:700}
  .src-contract{background:#2e2258;color:var(--purple)}
  .src-tier{background:#064e3b;color:#6ee7b7}
  .src-base{background:var(--raised);color:var(--muted)}
  .src-override{background:#4a2c02;color:var(--amber)}
  .line-total{font-size:14px;font-weight:700}
  .reason-in{width:100%;margin-top:8px;padding:7px 10px;font-size:12px;border-color:var(--amber)}
  .warn{font-size:11px;color:var(--amber);margin-top:6px}

  .cart-foot{border-top:1px solid var(--border);padding:14px 16px;flex-shrink:0}
  .totrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .totlabel{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
  .totval{font-size:26px;font-weight:700;color:var(--green)}
  .paybtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .paybtns button{padding:12px 6px;font-size:12px;letter-spacing:1px}
  .b-cash{background:var(--green);color:#fff}
  .b-tf{background:var(--blue);color:#fff}
  .b-tempo{background:#374151;color:#fff}
  .paybtns button:disabled{opacity:.35;cursor:not-allowed}

  /* ---------- TOAST ---------- */
  #toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
    background:var(--raised);border:1px solid var(--green);color:var(--text);
    padding:14px 22px;border-radius:10px;font-size:14px;z-index:200;display:none;
  }
  #toast.show{display:block}
  #toast b{color:var(--green);letter-spacing:1px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <h1>Central POS</h1>
    <p>Masuk untuk mulai</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
    <button onclick="doLogin()">Masuk</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="brand">Central POS</div>
    <div class="who"><b id="whoName">—</b> · <span id="whoLoc">—</span></div>
    <button class="logout" onclick="doLogout()">Keluar</button>
  </div>

  <div class="main">
    <div class="left">
      <div class="searchrow">
        <input id="search" placeholder="Cari produk atau jasa…" autocomplete="off">
      </div>
      <div class="grid" id="grid"><div class="empty">Memuat produk…</div></div>
    </div>

    <div class="right">
      <div class="cart-head">
        <label>Pelanggan</label>
        <select id="cust" onchange="customerChanged()"></select>
        <div class="contract-note" id="contractNote"></div>
      </div>
      <div class="lines" id="lines">
        <div class="empty">Belum ada item.</div>
      </div>
      <div class="cart-foot">
        <div class="totrow">
          <span class="totlabel">Total</span>
          <span class="totval" id="total">Rp 0</span>
        </div>
        <div class="paybtns">
          <button class="b-cash"  id="bCash"  onclick="checkout('cash')">Tunai</button>
          <button class="b-tf"    id="bTf"    onclick="checkout('transfer')">Transfer</button>
          <button class="b-tempo" id="bTempo" onclick="checkout('tempo')">Tempo</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ═══════════════════════════════════════════
//  CONFIG — ganti dua baris ini
// ═══════════════════════════════════════════
const SUPABASE_URL = "https://nqucbmpjqfkydbxtjeoj.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xdWNibXBqcWZreWRieHRqZW9qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyODE1NTEsImV4cCI6MjEwMjg1NzU1MX0.mWQMYJiqzKtXtg68CmW1Aq6c96akIpyh4e9uDq_fDq4";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let me = null;          // profile row
let products = [];
let customers = [];
let cart = [];          // {product, qty, standard, price, source, reason}

const rp = n => "Rp " + Math.round(n).toLocaleString("id-ID");

// ── AUTH ───────────────────────────────────
async function doLogin(){
  const err = document.getElementById("loginErr");
  err.textContent = "";
  const email = document.getElementById("email").value.trim();
  const pass  = document.getElementById("pass").value;
  if(!email || !pass){ err.textContent = "Isi email dan password."; return; }

  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if(error){ err.textContent = "Login gagal: " + error.message; return; }
  await start();
}

async function doLogout(){
  await sb.auth.signOut();
  location.reload();
}

async function start(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user) return;

  const { data:prof, error } = await sb
    .from("profiles")
    .select("*, locations(*)")
    .eq("id", user.id)
    .single();

  if(error || !prof){
    document.getElementById("loginErr").textContent =
      "Akun belum punya profil. Jalankan insert into profiles di SQL Editor.";
    return;
  }

  me = prof;
  document.getElementById("whoName").textContent = prof.full_name;
  document.getElementById("whoLoc").textContent  = prof.locations?.name || "—";
  document.getElementById("login").classList.add("hide");
  document.getElementById("app").classList.add("show");

  await loadCustomers();
  await loadProducts();
  document.getElementById("search").focus();
}

// ── DATA ───────────────────────────────────
async function loadCustomers(){
  const { data } = await sb.from("customers")
    .select("id,name,customer_type,price_adjust_pct")
    .eq("is_active", true).order("name");
  customers = data || [];
  const sel = document.getElementById("cust");
  sel.innerHTML = customers.map(c =>
    `<option value="${c.id}">${c.name}${c.customer_type!=='retail' ? ' · '+c.customer_type : ''}</option>`
  ).join("");
  customerChanged();
}

async function loadProducts(){
  const { data } = await sb.from("products")
    .select("id,sku,name,base_price,is_service,variant_group,variant_label")
    .eq("is_active", true).order("name");
  products = data || [];
  renderGrid("");
}

async function customerChanged(){
  const cid = +document.getElementById("cust").value;
  const note = document.getElementById("contractNote");
  const { data } = await sb.from("contracts")
    .select("name").eq("customer_id", cid).eq("is_active", true);
  note.textContent = data && data.length ? "Harga kontrak aktif: " + data[0].name : "";
  // re-price everything already in the cart
  for(let i=0;i<cart.length;i++) await repriceLine(i, true);
  renderCart();
}

// ── SEARCH GRID ────────────────────────────
function renderGrid(q){
  const grid = document.getElementById("grid");
  const term = q.trim().toLowerCase();
  const list = (term
      ? products.filter(p => p.name.toLowerCase().includes(term) || (p.sku||"").includes(term))
      : products
    ).slice(0, 60);

  if(!list.length){ grid.innerHTML = `<div class="empty">Tidak ada hasil untuk "${q}".</div>`; return; }

  grid.innerHTML = list.map(p => `
    <button class="pcard" onclick="addLine(${p.id})">
      <div class="pname">${p.name}</div>
      <div class="psku">${p.sku || ""}</div>
      <div class="pprice">${rp(p.base_price)}</div>
      ${p.is_service ? '<span class="ptag tag-svc">Jasa</span>' : ''}
      ${p.variant_group ? `<span class="ptag tag-grp">${p.variant_group} ${p.variant_label||""}</span>` : ''}
    </button>`).join("");
}

document.getElementById("search").addEventListener("input", e => renderGrid(e.target.value));
document.getElementById("search").addEventListener("keydown", e => {
  if(e.key === "Enter"){
    const term = e.target.value.trim().toLowerCase();
    const hit = products.filter(p => p.name.toLowerCase().includes(term) || (p.sku||"").includes(term));
    if(hit.length === 1){ addLine(hit[0].id); e.target.value=""; renderGrid(""); }
  }
});

// ── CART ───────────────────────────────────
async function addLine(pid){
  const p = products.find(x => x.id === pid);
  const existing = cart.findIndex(l => l.product.id === pid && !l.reason);
  if(existing > -1){
    cart[existing].qty++;
    await repriceLine(existing);
  } else {
    cart.push({ product:p, qty:1, standard:p.base_price, price:p.base_price, source:"base", reason:"" });
    await repriceLine(cart.length - 1);
  }
  renderCart();
}

async function repriceLine(i, keepOverride){
  const l = cart[i];
  const { data } = await sb.rpc("get_price", {
    p_product_id : l.product.id,
    p_customer_id: +document.getElementById("cust").value,
    p_location_id: me.location_id,
    p_qty        : Math.round(l.qty)
  });
  const row = data && data[0];
  if(row){
    l.standard = Number(row.price);
    l.source   = row.source;
    if(!keepOverride || !l.reason){ l.price = l.standard; l.reason = ""; }
  }
}

async function setQty(i, v){
  const q = Math.max(1, parseInt(v) || 1);
  cart[i].qty = q;
  await repriceLine(i, true);   // tier may change with quantity
  renderCart();
}

function setPrice(i, v){
  const n = Math.max(0, parseFloat(String(v).replace(/[^\d.]/g,"")) || 0);
  cart[i].price = n;
  cart[i].source = (n !== cart[i].standard) ? "override" : cart[i].sourceOrig || "tier";
  if(n === cart[i].standard) cart[i].reason = "";
  renderCart();
}

function setReason(i, v){ cart[i].reason = v; validate(); }
function delLine(i){ cart.splice(i,1); renderCart(); }

function renderCart(){
  const box = document.getElementById("lines");
  if(!cart.length){
    box.innerHTML = '<div class="empty">Belum ada item.</div>';
    document.getElementById("total").textContent = "Rp 0";
    validate(); return;
  }

  box.innerHTML = cart.map((l,i) => {
    const isOverride = l.price !== l.standard;
    const isLower    = l.price < l.standard;
    const src = isOverride ? "override" : l.source;
    const lineTotal = l.qty * l.price;
    return `
    <div class="line">
      <div class="line-top">
        <div class="line-name">${l.product.name}</div>
        <button class="del" onclick="delLine(${i})">×</button>
      </div>
      <div class="line-mid">
        <input class="qty" type="number" min="1" value="${l.qty}"
               onchange="setQty(${i}, this.value)">
        <span class="times">×</span>
        <input class="price-in" value="${Math.round(l.price)}"
               onchange="setPrice(${i}, this.value)">
      </div>
      <div class="line-bot">
        <span class="src src-${src}">${src}</span>
        <span class="line-total">${rp(lineTotal)}</span>
      </div>
      ${isOverride ? `<div class="warn">Harga normal ${rp(l.standard)}</div>` : ""}
      ${isLower ? `<input class="reason-in" placeholder="Alasan turun harga (wajib)"
                    value="${l.reason||""}" onchange="setReason(${i}, this.value)">` : ""}
    </div>`;
  }).join("");

  const total = cart.reduce((s,l) => s + l.qty*l.price, 0);
  document.getElementById("total").textContent = rp(total);
  validate();
}

function validate(){
  const bad = cart.some(l => l.price < l.standard && !String(l.reason||"").trim());
  const empty = cart.length === 0;
  ["bCash","bTf","bTempo"].forEach(id =>
    document.getElementById(id).disabled = bad || empty);
}

// ── CHECKOUT ───────────────────────────────
async function checkout(method){
  if(!cart.length) return;

  const total = cart.reduce((s,l) => s + l.qty*l.price, 0);
  const cid   = +document.getElementById("cust").value;

  const { data: invNo, error: eInv } =
    await sb.rpc("next_invoice_no", { p_location_id: me.location_id });
  if(eInv){ alert("Gagal ambil nomor invoice: " + eInv.message); return; }

  const { data: sale, error: eSale } = await sb.from("sales").insert({
    invoice_no  : invNo,
    location_id : me.location_id,
    customer_id : cid,
    cashier_id  : me.id,
    status      : method === "tempo" ? "open" : "paid",
    receipt_type: cart.some(l => l.product.is_service) ? "invoice" : "small",
    subtotal    : total,
    total       : total,
    amount_paid : method === "tempo" ? 0 : total,
    closed_at   : method === "tempo" ? null : new Date().toISOString()
  }).select().single();

  if(eSale){ alert("Gagal simpan penjualan: " + eSale.message); return; }

  const items = cart.map(l => ({
    sale_id        : sale.id,
    product_id     : l.product.id,
    qty            : l.qty,
    standard_price : l.standard,
    unit_price     : l.price,
    price_source   : l.price !== l.standard ? "override" : l.source,
    override_reason: l.price !== l.standard ? (l.reason || "dinaikkan") : null,
    overridden_by  : l.price !== l.standard ? me.id : null,
    line_total     : l.qty * l.price
  }));

  const { error: eItems } = await sb.from("sale_items").insert(items);
  if(eItems){ alert("Gagal simpan item: " + eItems.message); return; }

  const { error: ePay } = await sb.from("payments").insert({
    sale_id: sale.id,
    amount : method === "tempo" ? 0 : total,
    method : method,
    received_by: me.id
  });
  if(ePay){ alert("Gagal simpan pembayaran: " + ePay.message); return; }

  cart = [];
  renderCart();
  document.getElementById("search").value = "";
  renderGrid("");
  document.getElementById("search").focus();

  const t = document.getElementById("toast");
  t.innerHTML = `Tersimpan · <b>${invNo}</b> · ${rp(total)}`;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3500);
}

// ── BOOT ───────────────────────────────────
document.getElementById("pass").addEventListener("keydown", e => {
  if(e.key === "Enter") doLogin();
});
sb.auth.getSession().then(({data:{session}}) => { if(session) start(); });
</script>
</body>
</html>
